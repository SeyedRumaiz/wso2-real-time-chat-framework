          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        severityCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        outstandingSeverityCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        caseTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        casesTrend:
          type: array
          items:
            $ref: '#/components/schemas/CasesTrend'
        engagementTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        outstandingEngagementTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'

    ConversationStats:
      description: >-
        A handful of specific counts picked out of entity-service's
        conversation state breakdown.
      type: object
      properties:
        openCount:
          type: integer
          nullable: true
        activeCount:
          type: integer
          nullable: true
        resolvedCount:
          type: integer
          nullable: true
        abandonedCount:
          type: integer
          nullable: true

    ProjectSupportStats:
      description: >-
        Combines independently-fetched case and conversation stats; tolerates
        either source failing independently (see BuildProjectSupportStats) —
        a failed source's fields are simply omitted rather than failing the
        whole request.
      type: object
      properties:
        ongoingCases:
          type: integer
          nullable: true
        activeChats:
          type: integer
          nullable: true
        resolvedPast30DaysCasesCount:
          type: integer
          nullable: true
        resolvedChats:
          type: integer
          nullable: true

    ProjectTimeCardStats:
      type: object
      required: [totalHours, billableHours, nonBillableHours]
      properties:
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number

    ProjectChangeRequestStats:
      type: object
      required:
        - totalCount
        - activeCount
        - outstandingCount
        - actionRequiredCount
        - stateCount
        - resolvedCount
      properties:
        totalCount:
          type: integer
        activeCount:
          type: integer
        outstandingCount:
          type: integer
        actionRequiredCount:
          type: integer
        stateCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        resolvedCount:
          $ref: '#/components/schemas/ResolvedCountBreakdown'

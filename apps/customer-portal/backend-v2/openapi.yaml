          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /attachments/{id}/content:
    get:
      summary: Download an attachment's raw file content.
      description: >
        Response body is the raw file, not JSON. Content-Disposition:
        attachment is always set, forcing a download rather than inline
        rendering, mirroring entity-service's own XSS mitigation for this
        endpoint.
      operationId: getAttachmentsIdContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:

openapi: 3.0.1
info:
  title: Customer Portal API (v2)
  version: 0.1.0
  description: >
    Backend-for-frontend for the customer portal. Forwards requests to
    cs-tools/entity-service, the WSO2 Updates service, and the SCIM
    operations service, shaping every response into a portal-owned contract
    before it reaches the frontend. Work in progress — only the endpoints
    listed below are implemented so far.
security:
  - bearerAuth: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok

  /users/me:
    get:
      summary: Get the logged-in user's profile.
      description: >
        Profile fields (id, email, firstName, lastName, timeZone, roles) are
        sourced from entity-service; phoneNumber is sourced from SCIM.
        entity-service only serves this route when deployed with
        DATA_SOURCE=servicenow.
      operationId: getUsersMe
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMeResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    patch:
      summary: Update the logged-in user's phone number and/or time zone.
      description: >
        phoneNumber is updated via SCIM; timeZone is updated via
        entity-service (DATA_SOURCE=servicenow only). At least one field is
        required.
      operationId: patchUsersMe
      requestBody:
        description: User update payload — at least one field required.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /accounts/{id}:
    get:
      summary: Get an account by ID.
      description: >
        Normalizes entity-service's two data-source-dependent response shapes
        (Postgres vs ServiceNow) into one consistent contract — see
        AccountDetails.
      operationId: getAccountsId
      parameters:
        - name: id
          in: path
          description: ID of the account
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /accounts/search:
    post:
      summary: Search accounts.
      operationId: postAccountsSearch
      requestBody:
        description: Account search payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAccountsRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAccountsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /projects/{id}:
    get:
      summary: Get a project by ID.
      operationId: getProjectsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetails'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /projects/search:
    post:
      summary: Search projects.
      operationId: postProjectsSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchProjectsRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProjectsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases/{id}:
    get:
      summary: Get a case by ID.
      operationId: getCasesId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetails'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    patch:
      summary: Update a case.
      description: >
        Exactly one of state/severity/subject/description/watchList is
        required. This is a deliberately restricted subset of
        entity-service's update contract — internal WSO2 support fields
        (work state, engineer assignment, fix-ETA dates, case relinking,
        auto-closure control) are not customer-settable.
      operationId: patchCasesId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseUpdateRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseUpdateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases:
    post:
      summary: Create a case.
      operationId: postCases
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCreateRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCreateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases/{id}/comments:
    post:
      summary: Add a comment to a case.
      description: >
        Always creates a plain customer comment — entity-service's
        "work_note"/"activity" comment types are internal WSO2 support
        annotations and are not exposed here.
      operationId: postCasesIdComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseCommentRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseCommentResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /cases/search:
    post:
      summary: Search cases.
      operationId: postCasesSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchCasesRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchCasesResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /deployments/search:
    post:
      summary: Search deployments.
      operationId: postDeploymentsSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDeploymentsRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDeploymentsResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /deployments:
    post:
      summary: Create a deployment.
      description: >
        Only entity-service's ServiceNow data source supports this route —
        a Postgres-mode deployment always returns 400.
      operationId: postDeployments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentCreateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /updates/product-update-levels:
    get:
      summary: Get product update levels.
      operationId: getUpdatesProductUpdateLevels
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductUpdateLevel'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /updates/levels/search:
    post:
      summary: Search update descriptions between two update levels.
      operationId: postUpdatesLevelsSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatesSearchPayload'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/UpdateLevelGroup'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: x-jwt-assertion

  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Ref:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    NumberRef:
      type: object
      properties:
        id:
          type: string
        number:
          type: string

    PersonRef:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    # ---- users ----

    UserMeResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
        roles:
          type: array
          items:
            type: string
        phoneNumber:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    UserUpdateResponse:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    # ---- accounts ----

    SearchAccountsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            active:
              type: boolean
            pod:
              type: string
            classification:
              type: string

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string

    SearchAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string
        updatedOn:
          type: string

    # ---- projects ----

    SearchProjectsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
        closureStatus:
          type: string
        endDateFrom:
          type: string
        endDateTo:
          type: string
        sortBy:
          type: string
        sortOrder:
          type: string

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        closureState:
          type: string

    SearchProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string

    ProjectDetails:
      type: object
      properties:
        id:
          type: string
        account:
          $ref: '#/components/schemas/ProjectAccount'
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        closureState:
          type: string

    # ---- cases ----

    SearchCasesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        filters:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
            searchQuery:
              type: string
            projectIds:
              type: array
              items:
                type: string
            deploymentIds:
              type: array
              items:
                type: string
            states:
              type: array
              items:
                type: string
            severities:
              type: array
              items:
                type: string
            issueTypes:
              type: array
              items:
                type: string
            engagementTypes:
              type: array
              items:
                type: string
            createdBy:
              type: array
              items:
                type: string
            createdByMe:
              type: boolean
            workStates:
              type: array
              items:
                type: string
            assignedUserIds:
              type: array
              items:
                type: string
            productNames:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            parentId:
              type: string

    CaseSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        subject:
          type: string
        description:
          type: string
        state:
          type: string
        severity:
          type: string
        issueType:
          type: string
        engagementType:
          type: string
        workState:
          type: string
        type:
          type: string
        createdOn:
          type: string
        project:
          $ref: '#/components/schemas/Ref'
        deployment:
          $ref: '#/components/schemas/Ref'
        product:
          $ref: '#/components/schemas/Ref'
        assignedTeam:
          $ref: '#/components/schemas/Ref'

    SearchCasesResponse:
      type: object

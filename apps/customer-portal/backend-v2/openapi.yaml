          type: array
          items:
            $ref: '#/components/schemas/CaseTag'

    CaseCreateRequest:
      type: object
      required: [type, projectId, deploymentId, subject, description, severity, issueType]
      properties:
        type:
          type: string
          description: "\"case\", \"service_request\", or \"security_report_analysis\""
        projectId:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        deployedProductId:
          type: string
          format: uuid
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
        issueType:
          type: string
        catalogId:
          type: string
          description: Required when type is "service_request".
        catalogItemId:
          type: string
          description: Required when type is "service_request".
        variables:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              value:
                type: string
        relatedCaseId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        watchList:
          type: array
          items:
            type: string
        attachments:
          type: array
          description: Required (at least one) when type is "security_report_analysis".
          items:
            type: object
            properties:
              name:
                type: string
              file:
                type: string
                description: Base64 data URI, e.g. "data:application/pdf;base64,...".


      type: object
      properties:
        id:
          type: string
        number:
          type: string
        createdOn:
          type: string
        state:
          type: string

    CaseUpdateRequest:
      description: >
        Exactly one of state/severity/subject/description/watchList is
        required. resolutionCode/cause/closeNotes are only accepted
        alongside a closing state transition.
      type: object
      properties:
        state:
          type: string
        severity:
          type: string
        subject:
          type: string
        description:
          type: string
        watchList:
          type: array

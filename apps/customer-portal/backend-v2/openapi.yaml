          type: string
        productVersion:
          type: string
        startingUpdateLevel:
          type: integer
        endingUpdateLevel:
          type: integer

    SecurityAdvisory:
      type: object
      properties:
        id:
          type: string
        overview:
          type: string
        severity:
          type: string
        description:
          type: string
        impact:
          type: string
        solution:
          type: string
        notes:
          type: string
        credits:
          type: string

    DependantRelease:
      type: object
      properties:
        repository:
          type: string
        releaseVersion:
          type: string

    UpdateDescription:
      type: object
      properties:
        updateLevel:
          type: integer
        productName:
          type: string
        productVersion:
          type: string
        channel:
          type: string
        updateType:
          type: string
        updateNumber:
          type: integer
        description:
          type: string
        instructions:
          type: string
        bugFixes:
          type: string
        filesAdded:
          type: string
        filesModified:
          type: string
        filesRemoved:
          type: string
        bundlesInfoChanges:
          type: string
        dependantReleases:
          type: array
          items:
            $ref: '#/components/schemas/DependantRelease'
        timestamp:
          type: integer
          format: int64
        securityAdvisories:
          type: array
          items:
            $ref: '#/components/schemas/SecurityAdvisory'

    UpdateLevelGroup:
      type: object
      properties:
        updateType:
          type: string
        updateDescriptionLevels:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDescription'

    # ---- product consumption ----

    LicenseSubscriptionData:
      type: object
      required: [deploymentId, deploymentName, subscriptionKey, clientId, clientSecret, secrets]
      properties:
        deploymentId:
          type: string
        deploymentName:
          type: string
        subscriptionKey:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
        secrets:
          type: string

    LicenseResponse:
      type: object
      required: [subscriptionData, signature]
      properties:
        subscriptionData:
          $ref: '#/components/schemas/LicenseSubscriptionData'
        signature:
          type: string

    ImportDeploymentUsageResponse:
      type: object
      properties:
        message:
          type: string
        result:
          description: Arbitrary result payload from the upstream product-consumption service.

    # ---- project stats ----
    #
    # GET /projects/{id}/filters, /features, /stats, /stats/cases,
    # /stats/conversations, /stats/support, /stats/time-cards, and
    # /stats/change-requests — see internal/dto/project_stats.go and this
    # backend's CLAUDE.md, "Project metadata and stats — reshaped, not
    # passed through".

    ReferenceItem:
      description: >-
        A flattened {id, label, count?} view of entity-service's
        ChoiceListItem/ReferenceTableItem, used across every project
        metadata/stats endpoint.
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        count:
          type: integer
          nullable: true

    ChoiceListItem:
      description: >-
        entity-service's ChoiceListItem, embedded as-is in CasesTrend.severities
        rather than flattened to ReferenceItem.
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        count:
          type: integer
          nullable: true

    ProjectFilterOptions:
      type: object
      required:
        - caseStates
        - severities
        - issueTypes
        - deploymentTypes
        - callRequestStates
        - changeRequestStates
        - changeRequestImpacts
        - conversationStates
        - caseTypes
        - timeCardStates
        - engagementTypes
        - engagementPaymentTypes
        - severityBasedAllocationTime
      properties:
        caseStates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        severities:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        issueTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        deploymentTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        callRequestStates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        changeRequestStates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        changeRequestImpacts:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        conversationStates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        caseTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        timeCardStates:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        engagementTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        engagementPaymentTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        severityBasedAllocationTime:
          type: object
          additionalProperties:
            type: integer

    ProjectFeatures:
      type: object
      required:
        - acceptedSeverityValues
        - hasServiceRequestWriteAccess
        - hasServiceRequestReadAccess
        - hasSraWriteAccess
        - hasSraReadAccess
        - hasChangeRequestReadAccess
        - hasEngagementsReadAccess
        - hasUpdatesReadAccess
        - hasTimeLogsReadAccess
        - hasDeploymentWriteAccess
        - hasDeploymentReadAccess
        - hasComponentAnalysisReadAccess
        - hasUsageMetricsReadAccess
      properties:
        acceptedSeverityValues:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        hasServiceRequestWriteAccess:
          type: boolean
        hasServiceRequestReadAccess:
          type: boolean
        hasSraWriteAccess:
          type: boolean
        hasSraReadAccess:
          type: boolean
        hasChangeRequestReadAccess:
          type: boolean
        hasEngagementsReadAccess:
          type: boolean
        hasUpdatesReadAccess:
          type: boolean
        hasTimeLogsReadAccess:
          type: boolean
        hasDeploymentWriteAccess:
          type: boolean
        hasDeploymentReadAccess:
          type: boolean
        hasComponentAnalysisReadAccess:
          type: boolean
        hasUsageMetricsReadAccess:
          type: boolean
        defaultCaseProductCategories:
          type: array
          nullable: true
          items:
            type: string
        srProductCategories:
          type: array
          nullable: true
          items:
            type: string

    ProjectStats:
      description: The headline counters on the project dashboard.
      type: object
      properties:
        openCases:
          type: integer
          nullable: true
        activeChats:
          type: integer
          nullable: true
        deployments:
          type: integer
          nullable: true
        slaStatus:
          type: string
          nullable: true
        outstandingCaseCount:
          type: integer
          nullable: true
        outstandingServiceRequestCount:
          type: integer
          nullable: true
        outstandingEngagementCount:
          type: integer
          nullable: true
        outstandingSraCount:
          type: integer
          nullable: true
        outstandingChangeRequestCount:
          type: integer
          nullable: true
        outstandingAnnouncementCount:
          type: integer
          nullable: true

    RecentActivity:
      description: The recent-activity panel on the project dashboard.
      type: object
      properties:
        totalHours:
          type: number
          nullable: true
        billableHours:
          type: number
          nullable: true
        lastDeploymentOn:
          type: string
          nullable: true

    ProjectDashboardStats:
      description: >-
        Combines entity-service's case/conversation/deployment/activity stats
        into one dashboard view; tolerates any of the four sources failing
        independently (see BuildProjectDashboardStats) — a failed source's
        fields are simply omitted rather than failing the whole request.
      type: object
      required: [projectStats, recentActivity]
      properties:
        projectStats:
          $ref: '#/components/schemas/ProjectStats'
        recentActivity:
          $ref: '#/components/schemas/RecentActivity'

    ResolvedCountBreakdown:
      description: >-
        The resolved-count breakdown shared by case and change-request stats
        responses.
      type: object
      required: [total, currentMonth, pastThirtyDays]
      properties:
        total:
          type: integer
        currentMonth:
          type: integer
        pastThirtyDays:
          type: integer

    ProjectCaseStatsChangeRate:
      description: >-
        The period-over-period change-rate figures embedded in
        ProjectCaseStats.
      type: object
      required: [resolvedEngagements, averageResponseTime]
      properties:
        resolvedEngagements:
          type: number
        averageResponseTime:
          type: number

    CasesTrend:
      description: >-
        The severity breakdown for a single time-unit bucket in a case-count
        trend series.
      type: object
      required: [period, severities]
      properties:
        period:
          type: string
        severities:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceListItem'

    ProjectCaseStats:
      type: object
      required:
        - totalCount
        - activeCount
        - outstandingCount
        - actionRequiredCount
        - averageResponseTime
        - resolvedCases
        - changeRate
        - stateCount
        - severityCount
        - outstandingSeverityCount
        - caseTypeCount
        - casesTrend
        - engagementTypeCount
        - outstandingEngagementTypeCount
      properties:
        totalCount:
          type: integer
        activeCount:
          type: integer
        outstandingCount:
          type: integer
        actionRequiredCount:
          type: integer
        averageResponseTime:
          type: number
        resolvedCases:
          $ref: '#/components/schemas/ResolvedCountBreakdown'
        changeRate:
          $ref: '#/components/schemas/ProjectCaseStatsChangeRate'
        stateCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        severityCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        outstandingSeverityCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        caseTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        casesTrend:
          type: array
          items:
            $ref: '#/components/schemas/CasesTrend'
        engagementTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        outstandingEngagementTypeCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'

    ConversationStats:
      description: >-
        A handful of specific counts picked out of entity-service's
        conversation state breakdown.
      type: object
      properties:
        openCount:
          type: integer
          nullable: true
        activeCount:
          type: integer
          nullable: true
        resolvedCount:
          type: integer
          nullable: true
        abandonedCount:
          type: integer
          nullable: true

    ProjectSupportStats:
      description: >-
        Combines independently-fetched case and conversation stats; tolerates
        either source failing independently (see BuildProjectSupportStats) —
        a failed source's fields are simply omitted rather than failing the
        whole request.
      type: object
      properties:
        ongoingCases:
          type: integer
          nullable: true
        activeChats:
          type: integer
          nullable: true
        resolvedPast30DaysCasesCount:
          type: integer
          nullable: true
        resolvedChats:
          type: integer
          nullable: true

    ProjectTimeCardStats:
      type: object
      required: [totalHours, billableHours, nonBillableHours]
      properties:
        totalHours:
          type: number
        billableHours:
          type: number
        nonBillableHours:
          type: number

    ProjectChangeRequestStats:
      type: object
      required:
        - totalCount
        - activeCount
        - outstandingCount
        - actionRequiredCount
        - stateCount
        - resolvedCount
      properties:
        totalCount:
          type: integer
        activeCount:
          type: integer
        outstandingCount:
          type: integer
        actionRequiredCount:
          type: integer
        stateCount:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        resolvedCount:
          $ref: '#/components/schemas/ResolvedCountBreakdown'

    # ---- global metadata / search ----

    FeedbackEmojiChip:
      type: object
      required: [id, name, value]
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string

    FeedbackEmoji:
      type: object
      required: [id, name, value, unselectedImage, selectedImage, chips]
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        unselectedImage:
          type: string
        selectedImage:
          type: string
        chips:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackEmojiChip'

    FeatureFlags:
      description: >-
        A portal-only value that never comes from entity-service — see
        dto.defaultFeatureFlags.
      type: object
      required: [usageMetricsEnabled]
      properties:
        usageMetricsEnabled:
          type: boolean

    MetadataResponse:
      type: object
      required: [timeZones, projectTypes, feedbackEmojies, featureFlags]
      properties:
        timeZones:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        projectTypes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
        feedbackEmojies:
          description: >-
            Sic — this is the actual field name on the wire (misspelled).
          type: array
          items:
            $ref: '#/components/schemas/FeedbackEmoji'
        featureFlags:
          $ref: '#/components/schemas/FeatureFlags'

    GlobalSearchRequest:
      type: object
      properties:
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            types:
              type: array
              items:
                type: string
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        projectsPagination:
          description: limit is capped at 50 server-side.
          $ref: '#/components/schemas/Pagination'
        casesPagination:
          $ref: '#/components/schemas/Pagination'

    GlobalSearchProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        key:
          type: string
        type:
          $ref: '#/components/schemas/ReferenceItem'
        createdOn:
          type: string
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        hasPdpSubscription:
          type: boolean
        closureState:
          type: string
          nullable: true
        account:
          $ref: '#/components/schemas/ReferenceItem'
        activeChatsCount:
          type: integer
        actionRequiredCount:
          type: integer
        outstandingCount:
          type: integer

    GlobalSearchCase:
      type: object
      properties:
        id:
          type: string
        internalId:
          type: string
        number:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        createdOn:
          type: string
        createdBy:
          type: string
        updatedOn:
          type: string
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        caseType:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        state:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        severity:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        assignedEngineer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        account:
          $ref: '#/components/schemas/ReferenceItem'

    GlobalSearchResponse:
      type: object
      properties:
        query:
          type: string
        projectsTotal:
          type: integer
        casesTotal:
          type: integer
        projects:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSearchProject'
        cases:
          type: array
          items:
            $ref: '#/components/schemas/GlobalSearchCase'

    VulnerabilityMetaResponse:
      type: object
      properties:
        severities:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'

    # ---- conversations (GET/PATCH by id, create) ----

    ConversationDetails:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
          nullable: true
        initialMessage:
          type: string
          nullable: true
        messageCount:
          type: integer
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        case:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        state:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        createdOn:
          type: string
        createdBy:
          type: string
        updatedOn:
          type: string
        updatedBy:
          type: string

    ConversationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [closed, abandoned, converted]

    # ---- case feedback ----

    CaseFeedbackEmoji:
      description: >-
        The trimmed emoji reference on GET /cases/{id}/feedback — id/name/
        selectedImage only.
      type: object
      required: [id, name, selectedImage]
      properties:
        id:
          type: string
        name:
          type: string
        selectedImage:
          type: string

    CaseFeedback:
      type: object
      required: [id, emoji, chips, assessmentId, createdBy, createdOn]
      properties:
        id:
          type: string
        emoji:
          $ref: '#/components/schemas/CaseFeedbackEmoji'
        chips:
          type: array
          items:
            type: string
        assessmentId:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string
        additionalComment:
          type: string
          nullable: true

    SubmitCaseFeedbackRequest:
      type: object
      required: [emojiId]
      properties:
        emojiId:
          type: string
        chipIds:
          type: array
          items:
            type: string
        additionalComment:
          type: string
          nullable: true

    SubmittedCaseFeedback:
      type: object
      required: [id, assessmentId, caseId, createdBy, createdOn]
      properties:
        id:
          type: string
        assessmentId:
          type: string
        caseId:
          type: string
        createdBy:
          type: string
        createdOn:
          type: string

    SubmitCaseFeedbackResponse:
      type: object
      required: [message, feedback]
      properties:
        message:
          type: string
        feedback:
          $ref: '#/components/schemas/SubmittedCaseFeedback'

    # ---- attachments (get-by-id, reference-scoped update) ----

    AttachmentDetails:
      description: >-
        Metadata plus base64-encoded content — entity-service's response has
        no fields worth restricting here, so this is a direct passthrough
        shape.
      type: object
      required: [id, referenceId, name, type, sizeBytes, createdBy, createdOn, content]
      properties:
        id:
          type: string
        referenceId:
          type: string
        name:
          type: string
        type:
          type: string
        sizeBytes:
          type: integer
        description:
          type: string
          nullable: true
        createdBy:
          type: string
        createdOn:
          type: string
          format: date-time
        downloadUrl:
          type: string
          nullable: true
        previewUrl:
          type: string
          nullable: true
        content:
          description: Base64-encoded file content.
          type: string

    AttachmentUpdateRequest:
      description: >-
        referenceId/referenceType are never client-supplied — each handler
        injects them from its own path params. The case-scoped route
        (PATCH /cases/{caseId}/attachments/{attachmentId}) only ever reads
        name, never description, by design for that route.
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    UpdatedAttachment:
      type: object
      required: [id, updatedOn, updatedBy]
      properties:
        id:
          type: string
        updatedOn:
          type: string
          format: date-time
        updatedBy:
          type: string

    # ---- deployed product metrics / usage counts ----

    DateRangePayload:
      description: >-
        deploymentId is never client-supplied — always injected from the
        path by the calling handler.
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
        endDate:
          type: string

    DeployedProductRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    DeployedProductMetricsInstance:
      type: object
      required: [id, name, cores]
      properties:
        id:
          type: string
        name:
          type: string
        cores:
          type: integer

    DeployedProductMetricsChartEntry:
      type: object
      required: [date, instanceCount, totalCores, minCores, maxCores, avgCores, instances]
      properties:
        date:
          type: string
        instanceCount:
          type: integer
        totalCores:
          type: integer
        minCores:
          type: integer
        maxCores:
          type: integer
        avgCores:
          type: number
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProductMetricsInstance'

    DeployedProductMetricsDateRange:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
        end:
          type: string

    DeployedProductMetricsSummary:
      type: object
      required: [dateRange, totalInstances]
      properties:
        dateRange:
          $ref: '#/components/schemas/DeployedProductMetricsDateRange'
        totalInstances:
          type: integer
        minCores:
          type: integer
          nullable: true
        maxCores:
          type: integer
          nullable: true
        avgCores:
          type: number
          nullable: true

    DeployedProductMetricsResponse:
      type: object
      required: [product, summary, chartData]
      properties:
        product:
          $ref: '#/components/schemas/DeployedProductRef'
        summary:
          $ref: '#/components/schemas/DeployedProductMetricsSummary'
        chartData:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProductMetricsChartEntry'

    UsageCountInstance:
      type: object
      required: [id, name, value]
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number

    UsageCountEntry:
      type: object
      required: [value, aggregation, instances]
      properties:
        value:
          type: number
        aggregation:
          type: string
        instances:
          type: array
          items:
            $ref: '#/components/schemas/UsageCountInstance'

    DeployedProductUsageCountsChartEntry:
      type: object
      required: [date, counts]
      properties:
        date:
          type: string
        counts:
          description: Keyed by count-type name.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UsageCountEntry'

    CountTypeAggregation:
      type: object
      required: [aggregation, min, max, avg]
      properties:
        aggregation:
          type: string
        min:
          type: number
        max:
          type: number
        avg:
          type: number

    DeployedProductUsageCountsSummary:
      type: object
      required: [dateRange, countTypes]
      properties:
        dateRange:
          $ref: '#/components/schemas/DeployedProductMetricsDateRange'
        countTypes:
          description: Keyed by count-type name.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CountTypeAggregation'

    DeployedProductUsageCountsResponse:
      type: object
      required: [product, summary, chartData]
      properties:
        product:
          $ref: '#/components/schemas/DeployedProductRef'
        summary:
          $ref: '#/components/schemas/DeployedProductUsageCountsSummary'
        chartData:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProductUsageCountsChartEntry'

    # ---- case escalations ----

    EscalationCreateRequest:
      description: >-
        caseId is never client-supplied — always injected from the path.
        action defaults to ESCALATE when omitted; reason is required when
        escalating.
      type: object
      properties:
        reason:
          type: string
        action:
          type: string
          enum: [ESCALATE, DEESCALATE]

    EscalationNotifiedUser:
      type: object
      required: [id, userName]
      properties:
        id:
          type: string
        userName:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    CreatedEscalation:
      type: object
      required: [id, case, currentLevel, previousLevel, createdBy, createdOn, notificationSentTo]
      properties:
        id:
          type: string
        case:
          $ref: '#/components/schemas/ReferenceItem'
        currentLevel:
          $ref: '#/components/schemas/ReferenceItem'
        previousLevel:
          $ref: '#/components/schemas/ReferenceItem'
        createdBy:
          type: string
        createdOn:
          type: string
        reason:
          type: string
          nullable: true
        notificationSentTo:
          type: array
          items:
            $ref: '#/components/schemas/EscalationNotifiedUser'

    EscalationCreateResponse:
      type: object
      required: [message, escalation]
      properties:
        message:
          type: string
        escalation:
          $ref: '#/components/schemas/CreatedEscalation'

    EscalationSearchRequest:
      description: >-
        caseId is never client-supplied — filters.caseIds is always forced
        to [caseId] server-side, and any client-supplied caseIds are
        discarded.
      type: object
      required: [pagination]
      properties:
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        pagination:
          $ref: '#/components/schemas/Pagination'

    Escalation:
      type: object
      required: [id, case, currentLevel, previousLevel, createdBy, createdOn, updatedOn, notificationSentTo]
      properties:
        id:
          type: string
        case:
          $ref: '#/components/schemas/ReferenceItem'
        currentLevel:
          $ref: '#/components/schemas/ReferenceItem'
        previousLevel:
          $ref: '#/components/schemas/ReferenceItem'
        createdBy:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        reason:
          type: string
          nullable: true
        notificationSentTo:
          type: array
          items:
            $ref: '#/components/schemas/EscalationNotifiedUser'

    EscalationSearchResponse:
      type: object
      required: [escalations, total, offset, limit]
      properties:
        escalations:
          type: array
          items:
            $ref: '#/components/schemas/Escalation'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # ---- project case time cards ----

    CaseTimeCardSearchRequest:
      description: >-
        projectIds is never client-supplied — always injected from the path
        into filters.projectIds server-side.
      type: object
      required: [pagination]
      properties:
        filters:
          type: object
          properties:
            startDate:
              type: string
            endDate:
              type: string
            states:
              type: array
              items:
                type: string
        pagination:
          $ref: '#/components/schemas/Pagination'

    CaseTimeCardCaseRef:
      type: object
      required: [id, number, name, updatedOn]
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        updatedOn:
          type: string
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'

    CaseTimeCardBillingInfo:
      type: object
      required: [totalTime, count]
      properties:
        totalTime:
          type: number
        count:
          type: integer

    CaseTimeCard:
      type: object
      required: [case, totalTime, totalCount, billable, nonBillable]
      properties:
        case:
          $ref: '#/components/schemas/CaseTimeCardCaseRef'
        totalTime:
          type: number
        totalCount:
          type: integer
        billable:
          $ref: '#/components/schemas/CaseTimeCardBillingInfo'
        nonBillable:
          $ref: '#/components/schemas/CaseTimeCardBillingInfo'

    CaseTimeCardSearchResponse:
      type: object
      required: [caseTimeCards, total, offset, limit]
      properties:
        caseTimeCards:
          type: array
          items:
            $ref: '#/components/schemas/CaseTimeCard'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    # ---- instances (search/metrics/usages/stats, fanned out 3 ways — see
    # dto/instance.go's package doc comment) ----

    InstanceSearchRequest:
      description: >-
        Exactly one path-scoped ID filter (project/deployment/deployed
        product) is injected server-side by the calling handler.
      type: object
      required: [pagination]
      properties:
        startDate:
          type: string
        endDate:
          type: string
        pagination:
          $ref: '#/components/schemas/Pagination'

    InstanceMetadata:
      type: object
      required: [id, deploymentMetadata, createdOn, updatedOn]
      properties:
        id:
          type: string
        coreCount:
          type: integer
          nullable: true
        updates:
          type: integer
          nullable: true
        jdkVersion:
          type: string
          nullable: true
        deploymentMetadata:
          type: object
          additionalProperties: true
        createdOn:
          type: string
        updatedOn:
          type: string
        customCreatedOn:
          type: string
          nullable: true
        customUpdatedOn:
          type: string
          nullable: true

    Instance:
      type: object
      required: [id, key, createdOn, updatedOn]
      properties:
        id:
          type: string
        key:
          type: string
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        product:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployedProduct:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        createdOn:
          type: string
        updatedOn:
          type: string
        metadata:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/InstanceMetadata'

    InstanceSearchResponse:
      type: object
      required: [instances, total, offset, limit]
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    InstanceDateRangeRequest:
      description: >-
        The path-scoped ID filter is injected server-side by the calling
        handler.
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
        endDate:
          type: string

    InstanceDataPoint:
      type: object
      required: [date, createdOn, deploymentMetadata]
      properties:
        date:
          type: string
        createdOn:
          type: string
        coreCount:
          type: integer
          nullable: true
        jdkVersion:
          type: string
          nullable: true
        updates:
          type: integer
          nullable: true
        deploymentMetadata:
          type: object
          additionalProperties: true

    InstanceMetric:
      type: object
      required: [instanceId, instanceKey, dataPoints]
      properties:
        instanceId:
          type: string
        instanceKey:
          type: string
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        product:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployedProduct:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        dataPoints:
          type: array
          items:
            $ref: '#/components/schemas/InstanceDataPoint'

    InstanceMetricsResponse:
      type: object
      required: [metrics, totalInstances, startDate, endDate]
      properties:
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/InstanceMetric'
        totalInstances:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceUsageSummary:
      description: entity-service's InstanceSummary — one period's usage counts for an instance.
      type: object
      required: [period, counts]
      properties:
        period:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer

    InstanceUsageEntry:
      type: object
      required: [instanceId, instanceKey, periodSummaries]
      properties:
        instanceId:
          type: string
        instanceKey:
          type: string
        project:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        product:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        deployedProduct:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReferenceItem'
        periodSummaries:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUsageSummary'

    InstanceUsageResponse:
      type: object
      required: [usages, totalInstances, startDate, endDate]
      properties:
        usages:
          type: array
          items:
            $ref: '#/components/schemas/InstanceUsageEntry'
        totalInstances:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceStatsRequest:
      description: >-
        dataSource is optional (1 = API Call, 2 = File Upload). Note: the
        project-scoped .../instances/stats/metrics/search variant does NOT
        forward dataSource to entity-service — a deliberate asymmetry versus
        the stats/usages/search family.
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
        endDate:
          type: string
        dataSource:
          type: integer
          nullable: true

    InstanceMetricSummary:
      type: object
      required: [current, min, max, avg]
      properties:
        current:
          type: number
        min:
          type: number
        max:
          type: number
        avg:
          type: number

    InstanceMetricsStatsResponse:
      type: object
      required: [stats, summary, total, startDate, endDate]
      properties:
        stats:
          description: Keyed by instance ID, then by metric bucket.
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        summary:
          $ref: '#/components/schemas/InstanceMetricSummary'
        total:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    InstanceUsageStatsResponse:
      description: >-
        Unlike InstanceMetricsStatsResponse, there is no summary block.
      type: object
      required: [stats, total, startDate, endDate]
      properties:
        stats:
          description: Keyed by instance ID, then by usage bucket.
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: integer
        total:
          type: integer
        startDate:
          type: string
        endDate:
          type: string

    # ---- registry (robot-account tokens) ----

    RegistryTokenCreateRequest:
      description: >-
        The server derives accountName, projectKey, snAccountId, snProjectId,
        and createdBy itself — the client only supplies robotName/tokenType/
        createdFor.
      type: object
      required: [robotName, tokenType]
      properties:
        robotName:
          description: Alphanumeric and dashes only.
          type: string
        tokenType:
          type: string
          enum: [Service, User]
        createdFor:
          description: Required when tokenType is Service.
          type: string

    RegistryTokenCreateResponse:
      type: object
      required: [secret]
      properties:
        secret:
          type: string

    RegistryPermission:
      type: object
      required: [namespace]
      properties:
        namespace:
          type: string

    RegistryToken:
      description: >-
        Description is deliberately omitted — it's an internal encoding the
        backend uses to recover project/type/owner for authorization, not
        something the frontend should render.
      type: object
      required: [name, disable, duration, permissions]
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        creationTime:
          type: string
        tokenType:
          type: string
          enum: [Service, User]
        createdFor:
          type: string
        createdBy:
          type: string
        expiresAt:
          type: string
        disable:
          type: boolean
        duration:
          type: integer
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/RegistryPermission'

    IntegrationUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string

    # ---- project contacts ----

    ContactAccount:
      type: object
      properties:
        id:
          type: string
        domainList:
          type: string
        classification:
          type: string
        isPartner:
          type: boolean
          nullable: true

    Contact:
      type: object
      required: [id, email, lastName, isCsAdmin, isLead, isCsIntegrationUser, isPortalUser, isSecurityContact]
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        isCsAdmin:
          type: boolean
        isLead:
          type: boolean
        isCsIntegrationUser:
          type: boolean
        isPortalUser:
          type: boolean
        isSecurityContact:
          type: boolean
        membershipStatus:
          type: string
        account:
          $ref: '#/components/schemas/ContactAccount'

    ContactOnboardRequest:
      description: >-
        adminEmail is never client-supplied — always injected as the
        caller's own email.
      type: object
      required: [contactEmail, contactFirstName, contactLastName, isCsIntegrationUser]
      properties:
        contactEmail:
          type: string
        contactFirstName:
          type: string
        contactLastName:
          type: string
        isCsIntegrationUser:
          type: boolean
        isCsAdmin:
          type: boolean
        isLead:
          type: boolean
        isPortalUser:
          type: boolean
        isSecurityContact:
          type: boolean

    ContactRef:
      type: object
      properties:
        id:
          type: string
        email:
          type: string

    Membership:
      type: object
      required: [id, state, isCsAdmin, isLead, isPortalUser, isSecurityContact]
      properties:
        id:
          type: string
        state:
          type: string
        isCsAdmin:
          type: boolean
        isLead:
          type: boolean
        isPortalUser:
          type: boolean
        isSecurityContact:
          type: boolean
        contact:
          $ref: '#/components/schemas/ContactRef'

    MembershipRoleUpdateRequest:
      description: >-
        adminEmail is never client-supplied — always injected as the
        caller's own email.
      type: object
      properties:
        isCsAdmin:
          type: boolean
        isLead:
          type: boolean
        isPortalUser:
          type: boolean
        isSecurityContact:
          type: boolean

    ContactValidationRequest:
      type: object
      required: [contactEmail]
      properties:
        contactEmail:
          type: string

    ContactValidationResponse:
      type: object
      required: [isContactValid, message]
      properties:
        isContactValid:
          type: boolean
        message:
          type: string
        contactDetails:
          $ref: '#/components/schemas/Contact'

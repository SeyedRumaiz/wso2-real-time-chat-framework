components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: x-jwt-assertion

  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Ref:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    NumberRef:
      type: object
      properties:
        id:
          type: string
        number:
          type: string

    PersonRef:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    # ---- users ----

    UserMeResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
        roles:
          type: array
          items:
            type: string
        phoneNumber:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    UserUpdateResponse:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    # ---- accounts ----

    SearchAccountsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            active:
              type: boolean
            pod:
              type: string
            classification:
              type: string

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string

    SearchAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string
        updatedOn:
          type: string

    # ---- projects ----

    SearchProjectsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
        closureStatus:
          type: string
        endDateFrom:
          type: string
        endDateTo:
          type: string
        sortBy:
          type: string
        sortOrder:
          type: string

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        closureState:
          type: string

    SearchProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string

    ProjectDetails:
      type: object
      properties:
        id:
          type: string
        account:
          $ref: '#/components/schemas/ProjectAccount'
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        closureState:
          type: string

    # ---- cases ----

    SearchCasesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        filters:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
            searchQuery:
              type: string
            projectIds:
              type: array
              items:
                type: string
            deploymentIds:
              type: array
              items:
                type: string
            states:
              type: array
              items:
                type: string
            severities:
              type: array
              items:
                type: string
            issueTypes:
              type: array
              items:
                type: string
            engagementTypes:
              type: array
              items:
                type: string
            createdBy:
              type: array
              items:
                type: string
            createdByMe:
              type: boolean
            workStates:
              type: array
              items:
                type: string
            assignedUserIds:
              type: array
              items:
                type: string
            productNames:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            parentId:
              type: string

    CaseSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        subject:
          type: string
        description:
          type: string
        state:
          type: string
        severity:
          type: string
        issueType:
          type: string
        engagementType:
          type: string
        workState:
          type: string
        type:
          type: string
        createdOn:
          type: string
        project:
          $ref: '#/components/schemas/Ref'
        deployment:
          $ref: '#/components/schemas/Ref'
        product:
          $ref: '#/components/schemas/Ref'
        assignedTeam:
          $ref: '#/components/schemas/Ref'

    SearchCasesResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CaseTag:
      type: object
      properties:
        label:
          type: string
        color:
          type: string

    LinkedServiceRequest:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string

    CaseDetails:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
        issueType:
          type: string
        state:
          type: string
        workState:
          type: string
        type:
          type: string

          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /registry-tokens/{id}/regenerate:
    post:
      summary: Regenerate a registry token's secret.
      description: >-
        No request body. Authorization is indirect, matching
        DELETE /registry-tokens/{id}.
      operationId: postRegistryTokensIdRegenerate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryTokenCreateResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /projects/{id}/contacts:
    get:
      summary: Get a project's contacts.
      operationId: getProjectsIdContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    post:
      summary: Add a contact to a project.
      description: >-
        adminEmail is never client-supplied — always the caller's own email.
      operationId: postProjectsIdContacts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactOnboardRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /projects/{id}/contacts/{email}:
    delete:
      summary: Remove a contact from a project.
      operationId: deleteProjectsIdContactsEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: email
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
    patch:
      summary: Update a project contact's membership roles.
      description: >-
        adminEmail is never client-supplied — always the caller's own email.
      operationId: patchProjectsIdContactsEmail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: email
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRoleUpdateRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

  /projects/{id}/contacts/validate:
    post:
      summary: Validate whether an email can be added as a project contact.
      description: >-
        Upstream 3-way result: a brand-new email is valid; an email matching
        an existing-but-deactivated contact is valid (contactDetails
        populated); an email matching an active contact already on the
        project conflicts (409).
      operationId: postProjectsIdContactsValidate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactValidationRequest'
        required: true
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactValidationResponse'
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "404":
          description: NotFound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'

components:
  securitySchemes:
    bearerAuth:
      type: apiKey
      in: header
      name: x-jwt-assertion

  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    Ref:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    NumberRef:
      type: object
      properties:
        id:
          type: string
        number:
          type: string

    PersonRef:
      type: object
      properties:
        name:
          type: string
        email:
          type: string

    # ---- users ----

    UserMeResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        timeZone:
          type: string
        roles:
          type: array
          items:
            type: string
        phoneNumber:
          type: string

    UserUpdateRequest:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    UserUpdateResponse:
      type: object
      properties:
        phoneNumber:
          type: string
        timeZone:
          type: string

    # ---- accounts ----

    SearchAccountsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        filters:
          type: object
          properties:
            searchQuery:
              type: string
            active:
              type: boolean
            pod:
              type: string
            classification:
              type: string

    AccountSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string

    SearchAccountsResponse:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    AccountDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string
        supportTier:
          type: string
        owner:
          $ref: '#/components/schemas/Ref'
        technicalOwner:
          $ref: '#/components/schemas/Ref'
        activationDate:
          type: string
        deactivationDate:
          type: string
        hasAgent:
          type: boolean
        hasKbReferences:
          type: boolean
        createdOn:
          type: string
        updatedOn:
          type: string

    # ---- projects ----

    SearchProjectsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
        closureStatus:
          type: string
        endDateFrom:
          type: string
        endDateTo:
          type: string
        sortBy:
          type: string
        sortOrder:
          type: string

    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        closureState:
          type: string

    SearchProjectsResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    ProjectAccount:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        region:
          type: string

    ProjectDetails:
      type: object
      properties:
        id:
          type: string
        account:
          $ref: '#/components/schemas/ProjectAccount'
        name:
          type: string
        key:
          type: string
        subscriptionType:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        closureState:
          type: string

    # ---- cases ----

    SearchCasesRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        sortBy:
          type: object
          properties:
            field:
              type: string
            order:
              type: string
        filters:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
            searchQuery:
              type: string
            projectIds:
              type: array
              items:
                type: string
            deploymentIds:
              type: array
              items:
                type: string
            states:
              type: array
              items:
                type: string
            severities:
              type: array
              items:
                type: string
            issueTypes:
              type: array
              items:
                type: string
            engagementTypes:
              type: array
              items:
                type: string
            createdBy:
              type: array
              items:
                type: string
            createdByMe:
              type: boolean
            workStates:
              type: array
              items:
                type: string
            assignedUserIds:
              type: array
              items:
                type: string
            productNames:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            parentId:
              type: string

    CaseSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        subject:
          type: string
        description:
          type: string
        state:
          type: string
        severity:
          type: string
        issueType:
          type: string
        engagementType:
          type: string
        workState:
          type: string
        type:
          type: string
        createdOn:
          type: string
        project:
          $ref: '#/components/schemas/Ref'
        deployment:
          $ref: '#/components/schemas/Ref'
        product:
          $ref: '#/components/schemas/Ref'
        assignedTeam:
          $ref: '#/components/schemas/Ref'

    SearchCasesResponse:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CaseTag:
      type: object
      properties:
        label:
          type: string
        color:
          type: string

    LinkedServiceRequest:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string

    CaseDetails:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
        issueType:
          type: string
        state:
          type: string
        workState:
          type: string
        type:
          type: string
        engagementType:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string
        closedOn:
          type: string
        createdBy:
          $ref: '#/components/schemas/PersonRef'
        project:
          $ref: '#/components/schemas/Ref'
        deployment:
          $ref: '#/components/schemas/Ref'
        deployedProduct:
          $ref: '#/components/schemas/Ref'
        product:
          $ref: '#/components/schemas/Ref'
        assignedTeam:
          $ref: '#/components/schemas/Ref'
        conversation:
          $ref: '#/components/schemas/Ref'
        assignedEngineer:
          $ref: '#/components/schemas/PersonRef'
        parentCase:
          $ref: '#/components/schemas/NumberRef'
        relatedCase:
          $ref: '#/components/schemas/NumberRef'
        linkedServiceRequests:
          type: array
          items:
            $ref: '#/components/schemas/LinkedServiceRequest'
        resolvedOn:
          type: string
        resolutionCode:
          type: string
        cause:
          type: string
        resolutionNotes:
          type: string
        fixEta:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/CaseTag'

    CaseCreateRequest:
      type: object
      required: [type, projectId, deploymentId, subject, description, severity, issueType]
      properties:
        type:
          type: string
          description: "\"case\", \"service_request\", or \"security_report_analysis\""
        projectId:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        deployedProductId:
          type: string
          format: uuid
        subject:
          type: string
        description:
          type: string
        severity:
          type: string
        issueType:
          type: string
        catalogId:
          type: string
          description: Required when type is "service_request".
        catalogItemId:
          type: string
          description: Required when type is "service_request".
        variables:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              value:
                type: string
        relatedCaseId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        watchList:
          type: array
          items:
            type: string
        attachments:
          type: array
          description: Required (at least one) when type is "security_report_analysis".
          items:
            type: object
            properties:
              name:
                type: string
              file:
                type: string
                description: Base64 data URI, e.g. "data:application/pdf;base64,...".

    CaseCreateResponse:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        createdOn:
          type: string
        state:
          type: string

    CaseUpdateRequest:
      description: >
        Exactly one of state/severity/subject/description/watchList is
        required. resolutionCode/cause/closeNotes are only accepted
        alongside a closing state transition.
      type: object
      properties:
        state:
          type: string
        severity:
          type: string
        subject:
          type: string
        description:
          type: string
        watchList:
          type: array
          items:
            type: string
        resolutionCode:
          type: string
        cause:
          type: string
        closeNotes:
          type: string

    CaseUpdateResponse:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string
        state:
          type: string
        severity:
          type: string
        workState:
          type: string
        watchList:
          type: array
          items:
            type: string
        assignedTo:
          $ref: '#/components/schemas/PersonRef'
        resolutionCode:
          type: string
        cause:
          type: string
        closeNotes:
          type: string
        resolvedOn:
          type: string
        parentCase:
          $ref: '#/components/schemas/NumberRef'
        fixEta:
          type: string

    CaseCommentRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CaseCommentResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string
        createdBy:
          type: string

    # ---- deployments ----

    SearchDeploymentsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        searchQuery:
          type: string
        projectIds:
          type: array
          items:
            type: string
        deploymentTypes:
          type: array
          items:
            type: string

    DeploymentSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        createdBy:
          $ref: '#/components/schemas/Ref'
        project:
          $ref: '#/components/schemas/Ref'
        createdOn:
          type: string
        updatedOn:
          type: string

    SearchDeploymentsResponse:
      type: object
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateDeploymentRequest:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        description:
          type: string

    DeploymentCreateResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string

    UpdateDeploymentRequest:
      description: Provide either name/type/description or active=false, but not both.
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
          nullable: true
        active:
          type: boolean

    DeploymentUpdateResponse:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string

    # ---- deployed products ----

    SearchDeployedProductsRequest:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        deploymentIds:
          type: array
          items:
            type: string

    DeployedProductVersion:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        releasedDate:
          type: string
        supportEoLDate:
          type: string

    DeployedProductSummary:
      type: object
      properties:
        id:
          type: string
        deployment:
          $ref: '#/components/schemas/Ref'
        product:
          $ref: '#/components/schemas/Ref'
        version:
          $ref: '#/components/schemas/DeployedProductVersion'
        cores:
          type: string
        tps:
          type: string
        category:
          type: string
        createdOn:
          type: string
        updatedOn:
          type: string

    SearchDeployedProductsResponse:
      type: object
      properties:
        deployedProducts:
          type: array
          items:
            $ref: '#/components/schemas/DeployedProductSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CreateDeployedProductRequest:
      type: object
      required: [projectId, deploymentId, productId, versionId]
      properties:
        projectId:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        cores:
          type: integer
        tps:
          type: number
        description:
          type: string

    DeployedProductCreateResponse:
      type: object
      properties:
        id:
          type: string
        createdOn:
          type: string

    UpdateDeployedProductRequest:
      description: Provide either cores/tps/description or active=false, but not both.
      type: object
      properties:
        deploymentId:
          type: string
          format: uuid
          description: Optional — scopes the update to this deployment.
        cores:
          type: integer
        tps:
          type: number
        description:
          type: string
        active:
          type: boolean

    DeployedProductUpdateResponse:
      type: object
      properties:
        id:
          type: string
        updatedOn:
          type: string

    # ---- attachments ----

    CreateAttachmentRequest:
      type: object
      required: [referenceId, referenceType, name, type, file]

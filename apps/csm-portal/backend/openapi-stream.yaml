openapi: 3.0.1
info:
  title: CSM Portal Case Activity Stream
  description: >
    Server-Sent Events endpoint served by csm-portal-backend's dedicated
    :9092 listener (see cmd/server/main.go) — kept out of openapi.yaml
    because that spec describes the :8080 REST API, which does not serve
    this path. Behind the same JWT auth as every other endpoint; see that
    backend's CLAUDE.md for why this listener is separate (long-lived
    connections vs. the REST listener's WriteTimeout/IdleTimeout).
  version: 1.0.0
security:
  - bearerAuth: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "9092"
paths:
  /cases/{id}/activities/stream:
    get:
      summary: Live case-activity updates.
      description: >
        Opens a long-lived Server-Sent Events connection. Emits a
        `case_updated` event (data: a compact JSON object, at minimum
        `{caseId, type, timestamp}` — never comment text or field values)
        whenever the case gets a new comment or its status changes; a
        comment-only `: ping` heartbeat every 15s otherwise. Returns 503
        when Event Hub isn't configured on the backend, since there would
        be nothing to broadcast.
      operationId: getCasesIdActivitiesStream
      parameters:
        - name: id
          in: path
          description: UUID of the case.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ok
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
        "503":
          description: ServiceUnavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPayload'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorPayload:
      type: object
      properties:
        message:
          type: string

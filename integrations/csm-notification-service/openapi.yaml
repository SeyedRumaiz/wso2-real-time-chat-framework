openapi: 3.0.1
info:
  title: CSM Notification Service API
  version: 1.0.0
  description: >
    Accepts domain events (case created, comment added, status changed, case
    assigned, incident created) from other services, publishes them to an
    event bus, and asynchronously reacts by sending email, Google Chat
    alerts, and voice calls. Fronted by Choreo's API Manager gateway
    (subscription + client credentials) — this service performs no inbound
    auth of its own.
security:
  - oauth2ClientCredentials: []
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check endpoint.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Ok

  /events:
    post:
      summary: >-
        Submit a domain event (case created, comment added, status changed,
        case assigned, or incident created). Validates and publishes the
        event to the event bus, responding 202 — the notification itself is
        sent asynchronously by this service's own consumer, not in this
        request.
      operationId: postEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Envelope'
        required: true
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "413":
          description: RequestEntityTooLarge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          # Placeholder — fill in with the actual token endpoint for this service's
          # Choreo-managed API once it's provisioned. Not a real/guessed URL.
          tokenUrl: "<token_url>"
          scopes: {}

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    CaseCreatedPayload:
      type: object
      additionalProperties: false
      required: [reporterName, projectName, caseId, caseTitle, caseType, priority, createdAt, description, caseLink, commentLink, recipients]
      properties:
        reporterName:
          type: string
        projectName:
          type: string
        caseId:
          type: string
        caseTitle:
          type: string
        caseType:
          type: string
        priority:
          type: string
        product:
          type: string
        createdAt:
          type: string
        description:
          type: string
        incidentImpactDescription:
          type: string
          description: Optional — omitted entirely from the rendered email when empty.
        caseLink:
          type: string
        commentLink:
          type: string
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            format: email
          description: >-
            Who to email. Supplied by the caller (e.g. csm-portal-backend) —
            this service has no entity-service client to resolve watchers,
            assignee, or reporter itself.

    CommentAddedPayload:
      type: object
      additionalProperties: false
      required: [name, projectId, caseTitle, caseComment, commentLink, caseLink, recipients]
      properties:
        name:
          type: string
        projectId:
          type: string
        caseTitle:
          type: string
        caseComment:
          type: string
        commentLink:
          type: string
        caseLink:
          type: string
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            format: email
          description: Who to email. See CaseCreatedPayload.recipients.

    StatusChangedPayload:
      type: object
      additionalProperties: false
      required: [caseId, newStatus, caseLink, commentLink, recipients]
      properties:
        caseId:
          type: string
        newStatus:
          type: string
        caseLink:
          type: string
        commentLink:
          type: string
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            format: email
          description: Who to email. See CaseCreatedPayload.recipients.

    CaseAssignedPayload:
      type: object
      additionalProperties: false
      required: [assignerName, assignerEmail, caseId, caseLink, commentLink, recipients]
      properties:
        assignerName:
          type: string
        assignerEmail:
          type: string
        caseId:
          type: string
        caseLink:
          type: string
        commentLink:
          type: string
        recipients:
          type: array
          minItems: 1
          items:
            type: string
            format: email
          description: Who to email. See CaseCreatedPayload.recipients.

    IncidentCreatedPayload:
      type: object
      additionalProperties: false
      required: [product, title, shortDescription, incidentLink, callTo]
      properties:
        product:
          type: string
          description: >-
            Selects which configured Google Chat space receives the alert
            (e.g. "api-manager"); matched case- and whitespace-insensitively
            against GOOGLE_CHAT_SPACES.
        title:
          type: string
        shortDescription:
          type: string
        incidentLink:
          type: string
          description: The "Open in Portal" button target on the Chat card.
        callTo:
          type: string
          description: On-call phone number in E.164 format (e.g. "+14155552671").

    CaseCreatedEvent:
      type: object
      required: [type, entityId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [case.created]
        entityId:
          type: string
        payload:
          $ref: '#/components/schemas/CaseCreatedPayload'

    CommentAddedEvent:
      type: object
      required: [type, entityId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [case.comment_added]
        entityId:
          type: string
        payload:
          $ref: '#/components/schemas/CommentAddedPayload'

    StatusChangedEvent:
      type: object
      required: [type, entityId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [case.status_changed]
        entityId:
          type: string
        payload:
          $ref: '#/components/schemas/StatusChangedPayload'

    CaseAssignedEvent:
      type: object
      required: [type, entityId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [case.assigned]
        entityId:
          type: string
        payload:
          $ref: '#/components/schemas/CaseAssignedPayload'

    IncidentCreatedEvent:
      type: object
      required: [type, entityId, payload]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [incident.created]
        entityId:
          type: string
        payload:
          $ref: '#/components/schemas/IncidentCreatedPayload'

    Envelope:
      oneOf:
        - $ref: '#/components/schemas/CaseCreatedEvent'
        - $ref: '#/components/schemas/CommentAddedEvent'
        - $ref: '#/components/schemas/StatusChangedEvent'
        - $ref: '#/components/schemas/CaseAssignedEvent'
        - $ref: '#/components/schemas/IncidentCreatedEvent'
      discriminator:
        propertyName: type
        mapping:
          case.created: '#/components/schemas/CaseCreatedEvent'
          case.comment_added: '#/components/schemas/CommentAddedEvent'
          case.status_changed: '#/components/schemas/StatusChangedEvent'
          case.assigned: '#/components/schemas/CaseAssignedEvent'
          incident.created: '#/components/schemas/IncidentCreatedEvent'

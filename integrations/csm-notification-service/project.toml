## Google Cloud Buildpacks build-time configuration (Choreo builds this
## component with the same Go buildpack — see the [builder] log lines
## "google.go.gomod"/"google.go.build" in a Choreo build).
##
## This directory has two `main` packages (cmd/server, cmd/twiliocheck), so
## the buildpack's auto-detection can't pick one and falls back to its
## default GOOGLE_BUILDABLE="." — which fails ("no Go files in /workspace"),
## since the module root itself has no .go files. cmd/twiliocheck is a
## manual, one-off verification tool (see its own doc comment) never meant
## to be deployed, so pin the real entrypoint explicitly instead.
[[build.env]]
    name = "GOOGLE_BUILDABLE"
    value = "./cmd/server"
